---
version: 2

project_name: go-tools

# One entry per directory of cmd/: the `build` job of ci.yaml fails when one is missing.
builds:
  - id: version
    main: ./cmd/version
    binary: version
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/nicodarge/go-tools/internal/buildinfo.Version={{ .Tag }}

archives:
  - formats: [binary]
    name_template: "{{ .Binary }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^ci:"
      - "^test:"

release:
  mode: keep-existing
