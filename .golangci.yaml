---
version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    govet:
      enable:
        - shadow
    gosec:
      config:
        global:
          nosec: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
