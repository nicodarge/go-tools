---
name: CI

"on":
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - run: go vet ./...
      - run: go test -race ./...

  golangci-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build golangci-lint
        run: scripts/install-tools.sh "${RUNNER_TEMP}/bin" golangci-lint
      - run: '"${RUNNER_TEMP}/bin/golangci-lint" run'

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build every command
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          for dir in cmd/*/; do
            name="$(basename "${dir}")"
            go build -trimpath -o "${RUNNER_TEMP}/out/${name}" "./cmd/${name}"
          done

  release-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Every command has a release build
        run: |
          set -euo pipefail
          for dir in cmd/*/; do
            name="$(basename "${dir}")"
            grep -qE "^\s+main: \./cmd/${name}$" .goreleaser.yaml || { echo "cmd/${name} has no build in .goreleaser.yaml" >&2; exit 1; }
          done
      - name: Build goreleaser
        run: scripts/install-tools.sh "${RUNNER_TEMP}/bin" goreleaser
      - run: '"${RUNNER_TEMP}/bin/goreleaser" check'
