---
name: Lint

"on":
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # renovate: datasource=pypi depName=pre-commit
      PRE_COMMIT_VERSION: 4.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.7
      - name: Cache the pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        run: |
          uv venv "${RUNNER_TEMP}/pre-commit-venv"
          uv pip install --python "${RUNNER_TEMP}/pre-commit-venv/bin/python" "pre-commit==${PRE_COMMIT_VERSION}"
          "${RUNNER_TEMP}/pre-commit-venv/bin/pre-commit" run --all-files --hook-stage manual --show-diff-on-failure --color=always
