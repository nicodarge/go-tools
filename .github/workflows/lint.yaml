---
name: Lint

"on":
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # renovate: datasource=pypi depName=pre-commit
      PRE_COMMIT_VERSION: 4.7.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Set up uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
        with:
          # renovate: datasource=github-releases depName=astral-sh/uv
          version: 0.13.9
      - name: Cache the pre-commit hook environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ runner.arch }}-${{ env.PRE_COMMIT_VERSION }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: pre-commit
        run: |
          uv venv "${RUNNER_TEMP}/pre-commit-venv"
          uv pip install --python "${RUNNER_TEMP}/pre-commit-venv/bin/python" "pre-commit==${PRE_COMMIT_VERSION}"
          "${RUNNER_TEMP}/pre-commit-venv/bin/pre-commit" run --all-files --hook-stage manual --show-diff-on-failure --color=always
