---
name: Release

"on":
  push:
    branches: [production]
  workflow_dispatch: {}  # the github.ref guard below stops an accident, not an author: a branch can rewrite this workflow

permissions:
  contents: read

# Runs queue rather than cancel: killing a release mid-flight can leave a tag with no assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: "**/go.sum"
      - name: Build svu and goreleaser
        run: scripts/install-tools.sh "${RUNNER_TEMP}/bin" svu goreleaser
      - name: Tag the next version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$("${RUNNER_TEMP}/bin/svu" current)"
          next="$("${RUNNER_TEMP}/bin/svu" next)"
          tag=""
          if [ "${next}" != "${current}" ]; then
            tag="${next}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "${tag}"
            git push origin "refs/tags/${tag}"
          elif [ "$(git rev-parse -q --verify "refs/tags/${current}^{commit}" || true)" = "$(git rev-parse HEAD)" ] \
            && ! gh release view "${current}" > /dev/null 2>&1; then
            # A re-run repairs a tag whose release failed.
            tag="${current}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Release
        if: steps.tag.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/bin/goreleaser" release --clean'
