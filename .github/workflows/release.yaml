---
name: Release

"on":
  push:
    branches: [production]

permissions:
  contents: read

# Runs queue rather than cancel: killing a release mid-flight can leave a tag with no assets.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build svu and goreleaser
        run: scripts/install-tools.sh "${RUNNER_TEMP}/bin" svu goreleaser
      - name: Tag the next version
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$("${RUNNER_TEMP}/bin/svu" current)"
          next="$("${RUNNER_TEMP}/bin/svu" next)"
          tag=""
          if [ "${next}" != "${current}" ]; then
            tag="${next}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" -m "${tag}"
            git push origin "refs/tags/${tag}"
          elif [ "$(git rev-parse -q --verify "refs/tags/${current}^{commit}" || true)" = "$(git rev-parse HEAD)" ]; then
            # A re-run repairs a tag whose release is missing or still a draft: goreleaser reuses the draft and replaces its assets.
            if out="$(gh release view "${current}" --json isDraft --jq .isDraft 2>&1)"; then
              if [ "${out}" != "false" ]; then
                tag="${current}"
              fi
            elif grep -q "release not found" <<< "${out}"; then
              tag="${current}"
            else
              echo "${out}" >&2
              exit 1
            fi
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
      - name: Release
        if: steps.tag.outputs.tag != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"${RUNNER_TEMP}/bin/goreleaser" release --clean'
